# lotel-managed-config v2 — regenerated by lotel; put custom config in ./lotel-collector.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  gen_ai_normalizer:
    sources:
      - name: openinference
      - name: openllmetry
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  file/traces:
    path: /data/traces/traces.jsonl
    format: json
    append: true
  file/metrics:
    path: /data/metrics/metrics.jsonl
    format: json
    append: true
  file/logs:
    path: /data/logs/logs.jsonl
    format: json
    append: true

connectors:
  spanmetrics:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    metrics_flush_interval: 5s
    metrics_expiration: 5m
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.provider.name
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: error.type

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [gen_ai_normalizer, batch]
      exporters: [file/traces, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [batch]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
  telemetry:
    logs:
      level: info
